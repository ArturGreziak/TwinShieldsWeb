<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1224"><title>Twin Shields</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1224;color:#fff;font-family:system-ui,sans-serif}#app{max-width:560px;margin:auto;min-height:100dvh;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}h1,h2{text-align:center}h1{font-size:38px;letter-spacing:2px}p{line-height:1.65;color:#bdcbe0}button{display:block;width:100%;padding:16px;margin:12px 0;border:0;border-radius:16px;background:#50e4ff;color:#0b1224;font:700 17px system-ui;cursor:pointer;min-height:52px}button:disabled{background:#263348;color:#92a1b6;cursor:default}button.secondary{background:#263348;color:white}.stats{text-align:center;color:#50e4ff;line-height:1.8;font-size:16px}.logo{text-align:center;font-size:72px;color:#50e4ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{margin:0;font-size:15px}canvas{width:100%;display:block;touch-action:none;border-radius:24px;background:#0b1224}#game{display:flex;flex-direction:column;min-height:calc(100dvh - 32px)}#game .arena{flex:1;display:flex;align-items:center;justify-content:center}#game canvas{max-height:65dvh;aspect-ratio:1;object-fit:contain}.row{display:flex;gap:10px}.row button{font-size:14px}.note{font-size:14px}a{color:#50e4ff}input{accent-color:#50e4ff}label{display:flex;gap:12px;align-items:center;padding:15px;background:#18243a;border-radius:12px;margin-bottom:12px}button:focus-visible,a:focus-visible{outline:3px solid #ffca6b;outline-offset:3px}@media(max-height:600px){#game canvas{max-height:52dvh}.stats{font-size:13px}}
</style></head><body><main id="app"></main>
<script>
'use strict';
const app=document.getElementById('app'),KEY='twin-shields-web-v1',TAU=Math.PI*2;
const defaults=()=>({coins:100,unlocked:1,best:0,sound:true,difficulty:1,run:null});
let data=defaults(),storageOK=true,run=null,page='home',paused=true,last=0,acc=0,frame=0,settled=false,earned=0,canvas,ctx,audio;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function validRun(s){return s&&['campaign','endless'].includes(s.mode)&&Number.isInteger(s.level)&&s.level>=1&&s.level<=20&&Number.isInteger(s.difficulty)&&s.difficulty>=0&&s.difficulty<=2&&Number.isInteger(s.lives)&&s.lives>=1&&s.lives<=3&&Number.isFinite(s.angle)&&Number.isFinite(s.time)&&s.time>=0&&s.time<1e7&&Number.isInteger(s.score)&&s.score>=0&&s.score<1e9&&Number.isInteger(s.blocks)&&s.blocks>=0&&Number.isFinite(s.spawn)&&s.spawn>=-1&&s.spawn<=10&&Number.isFinite(s.immunity)&&s.immunity>=0&&s.immunity<=5&&typeof s.revived==='boolean'&&Array.isArray(s.shots)&&s.shots.length<=200&&s.shots.every(p=>Number.isFinite(p.a)&&Number.isFinite(p.r)&&p.r>=0&&p.r<=2&&Number.isFinite(p.v)&&p.v>0&&p.v<2&&typeof p.out==='boolean')}
try{const p=JSON.parse(localStorage.getItem(KEY));if(p&&typeof p==='object'){for(const k of ['coins','best'])if(Number.isInteger(p[k])&&p[k]>=0&&p[k]<1e9)data[k]=p[k];if(Number.isInteger(p.unlocked))data.unlocked=clamp(p.unlocked,1,20);if(Number.isInteger(p.difficulty))data.difficulty=clamp(p.difficulty,0,2);if(typeof p.sound==='boolean')data.sound=p.sound;if(validRun(p.run))data.run=p.run}}catch(e){storageOK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true}catch(e){storageOK=false}}
function persist(){if(run&&!run.finished){data.run=JSON.parse(JSON.stringify(run));save()}}
function tone(type='tap'){if(!data.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});const notes={tap:[[700,.05]],block:[[880,.07],[1320,.1]],hit:[[180,.16]],win:[[523,.1],[659,.1],[784,.1],[1047,.2]],lose:[[440,.1],[330,.1],[220,.18]]};let at=audio.currentTime;for(const [f,d]of notes[type]){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.09,at+.008);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g).connect(audio.destination);o.start(at);o.stop(at+d);at+=d}}catch(e){}}
function stop(){paused=true;cancelAnimationFrame(frame);last=0;acc=0}
function screen(name,html){stop();page=name;app.innerHTML=html}
function btn(label,id,disabled=false,secondary=false){return `<button id="${id}" ${disabled?'disabled':''} class="${secondary?'secondary':''}">${label}</button>`}
function bind(id,fn){const el=document.getElementById(id);if(el)el.onclick=()=>{tone();fn()}}
function home(){persist();screen('home',`<div class="logo" aria-hidden="true">◉ ⌒ ◉</div><h1>TWIN SHIELDS</h1><p style="text-align:center">Two points. One shield. Protect the core.</p><div class="stats">Coins ${data.coins} · Best ${data.best}</div>${btn('Continue Game','continue',!data.run)}${btn('New Game','new')}${btn('How to Play','help',false,true)}${btn('Settings','settings',false,true)}${!storageOK?'<p class="note">Local storage is unavailable. Progress may not survive closing this page.</p>':''}`);bind('continue',()=>start(JSON.parse(JSON.stringify(data.run))));bind('new',()=>{if(!data.run||confirm('Starting a new game replaces your saved run. Continue?'))modes()});bind('help',help);bind('settings',settings)}
function modes(){screen('modes',`<h2>Choose Your Defense</h2><p>Campaign: 20 increasingly demanding waves.<br>Endless: survive and improve your personal best.</p>${btn('Campaign','campaign')}${btn('Endless','endless')}${btn('Home','home',false,true)}`);bind('campaign',levels);bind('endless',()=>fresh('endless',1));bind('home',home)}
function levels(){screen('levels',`<h2>Campaign Waves</h2><p>Complete a wave to unlock the next one.</p><div class="grid">${Array.from({length:20},(_,i)=>btn(`Wave ${i+1}<br>${i+1<=data.unlocked?10+(i+1)*2+' deflections':'Locked'}`,'level'+(i+1),i+1>data.unlocked)).join('')}</div>${btn('Back','back',false,true)}`);for(let i=1;i<=data.unlocked;i++)bind('level'+i,()=>fresh('campaign',i));bind('back',modes)}
function fresh(mode,level){start({mode,level,difficulty:data.difficulty,angle:-Math.PI/2,lives:3,score:0,blocks:0,time:0,spawn:1.8,immunity:0,revived:false,shots:[],finished:false,won:false})}
function start(s){run=s;run.finished=false;run.won=false;settled=false;earned=0;persist();game()}
function wrap(a){return ((a+Math.PI)%TAU+TAU)%TAU-Math.PI}
function span(){return [.95,.8,.65][run.difficulty]}
function update(dt){if(paused||run.finished)return;run.time+=dt;run.immunity=Math.max(0,run.immunity-dt);run.spawn-=dt;if(run.spawn<=0){const wave=run.mode==='endless'?Math.floor(run.time/25)+1:run.level;const v=Math.min(.7,.24+wave*.011+run.difficulty*.035),a=Math.random()*TAU;run.shots.push({a,r:1.24,v,out:false});if(wave>=6&&Math.random()>.65)run.shots.push({a:wrap(a+.5),r:1.45,v,out:false});run.spawn=Math.max(.65,1.6-wave*.025-run.difficulty*.13)}for(let i=run.shots.length-1;i>=0;i--){const p=run.shots[i],old=p.r;p.r+=(p.out?1:-1)*p.v*dt;if(!p.out&&old>=.52&&p.r<=.52&&Math.abs(wrap(p.a-run.angle))<=span()){p.out=true;p.r=.53;p.v*=1.8;run.score+=10;run.blocks++;tone('block')}if(!p.out&&p.r<=.13){run.shots.splice(i,1);if(run.immunity<=0){run.lives--;run.immunity=1.25;tone('hit')}}else if(p.r>1.7)run.shots.splice(i,1)}if(run.lives<=0){run.finished=true;tone('lose')}else if(run.mode==='campaign'&&run.blocks>=10+run.level*2){run.won=true;run.finished=true;run.score+=run.lives*25;tone('win')}}
function game(){screen('game',`<section id="game"><div id="hud" class="stats" aria-live="off"></div><div class="arena"><canvas id="arena" aria-label="Defense arena. Drag around the core or use left and right arrow keys to rotate your shield." tabindex="0"></canvas></div><p class="note" style="text-align:center;margin:0">Drag to rotate · Arrow keys also work</p>${btn('Pause','pause')}</section>`);canvas=document.getElementById('arena');ctx=canvas.getContext('2d');bind('pause',pauseMenu);let prev=null,pointer=null;function pos(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;if(Math.hypot(x,y)<.16/2.8)return null;return Math.atan2(y,x)}canvas.onpointerdown=e=>{if(pointer!==null)return;pointer=e.pointerId;prev=pos(e);canvas.setPointerCapture(pointer);canvas.focus()};canvas.onpointermove=e=>{if(e.pointerId!==pointer||paused)return;const a=pos(e);if(a!==null&&prev!==null)run.angle=wrap(run.angle+a-prev);prev=a};const up=e=>{if(e.pointerId===pointer){pointer=null;prev=null}};canvas.onpointerup=up;canvas.onpointercancel=up;canvas.onlostpointercapture=up;paused=false;last=0;acc=0;frame=requestAnimationFrame(loop);draw()}
let held=new Set(),saveAt=0;
window.addEventListener('keydown',e=>{if(page==='game'&&['ArrowLeft','ArrowRight','Escape',' '].includes(e.key)){e.preventDefault();if(e.key==='Escape'||e.key===' '){pauseMenu();return}held.add(e.key)}});window.addEventListener('keyup',e=>held.delete(e.key));
function loop(t){if(paused)return;if(last)acc+=Math.min(.1,(t-last)/1000);last=t;while(acc>=1/120&&!run.finished){if(held.has('ArrowLeft'))run.angle=wrap(run.angle-2.7/120);if(held.has('ArrowRight'))run.angle=wrap(run.angle+2.7/120);update(1/120);acc-=1/120}if(run.finished){settle();return}draw();if(t-saveAt>3000){persist();saveAt=t}frame=requestAnimationFrame(loop)}
function draw(){if(!canvas||!ctx||!run)return;const size=480,dpr=Math.min(2,window.devicePixelRatio||1);if(canvas.width!==size*dpr){canvas.width=size*dpr;canvas.height=size*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,size,size);const c=size/2,u=size/2.8;ctx.lineWidth=1.5;ctx.strokeStyle='#203049';for(const r of [.28,.52,.9,1.22]){ctx.beginPath();ctx.arc(c,c,r*u,0,TAU);ctx.stroke()}ctx.fillStyle=run.immunity>0&&Math.floor(run.time*10)%2===0?'#ffca6b':'white';circle(c,c,.095*u);ctx.strokeStyle='#50e4ff';ctx.lineWidth=.018*u;ctx.beginPath();ctx.arc(c,c,.14*u,0,TAU);ctx.stroke();ctx.lineWidth=.055*u;ctx.lineCap='round';ctx.beginPath();ctx.arc(c,c,.52*u,run.angle-span(),run.angle+span());ctx.stroke();for(const [i,a]of [run.angle-span(),run.angle+span()].entries()){ctx.fillStyle=i?'#ffca6b':'#50e4ff';circle(c+Math.cos(a)*.52*u,c+Math.sin(a)*.52*u,.066*u)}for(const p of run.shots){const x=c+Math.cos(p.a)*p.r*u,y=c+Math.sin(p.a)*p.r*u;ctx.fillStyle=ctx.strokeStyle=p.out?'#50e4ff':'#ff6a84';ctx.lineWidth=.024*u;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(p.a)*.07*u,y+Math.sin(p.a)*.07*u);ctx.stroke();circle(x,y,.028*u)}const secs=Math.floor(run.time);document.getElementById('hud').innerHTML=`${run.mode==='campaign'?'Wave '+run.level+' · '+run.blocks+'/'+(10+run.level*2):'Endless · '+run.blocks+' deflections'}<br>Score ${run.score} · Lives ${run.lives} · ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}<br>Coins ${data.coins}`}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function pauseMenu(){held.clear();persist();screen('pause',`<h2>Game Paused</h2><p>Your timer stops while paused. Your run is saved locally when browser storage is available.</p>${btn('Resume','resume')}${btn('Restart','restart',false,true)}${btn('Save & Home','home',false,true)}`);bind('resume',game);bind('restart',()=>{if(confirm('Restart this run?'))fresh(run.mode,run.level)});bind('home',home)}
function settle(){if(!settled){settled=true;data.run=null;data.best=Math.max(data.best,run.score);earned=run.won?50:0;data.coins+=earned;if(run.won)data.unlocked=Math.max(data.unlocked,Math.min(20,run.level+1));save()}results()}
function results(){screen('results',`<h2>${run.won?'Wave Complete!':'Core Lost'}</h2><div class="stats">Score ${run.score}<br>Deflections ${run.blocks}<br>Time ${Math.floor(run.time)} seconds<br>Coins earned ${earned}<br>Best ${data.best}</div>${run.won&&run.level<20?btn('Next Wave','next'):''}${run.won&&run.level===20?'<p>Campaign complete! Try Endless or replay any wave.</p>':''}${!run.won&&!run.revived?'<p>Recover once per run: restore 1 life and clear incoming shots.</p>'+btn('Recover · 100 coins','recover',data.coins<100):''}${btn('Play Again','again')}${btn('Home','home',false,true)}`);bind('next',()=>fresh('campaign',run.level+1));bind('recover',()=>{if(!run.revived&&data.coins>=100&&confirm('Spend 100 coins to restore 1 life?')){data.coins-=100;run.lives=1;run.revived=true;run.shots=[];run.spawn=2;run.immunity=2;start(run)}});bind('again',()=>fresh(run.mode,run.level));bind('home',()=>{run=null;home()})}
function settings(){screen('settings',`<h2>Settings</h2><label><input type="checkbox" id="sound" ${data.sound?'checked':''}>Sound effects</label><p>Difficulty for new games: ${['Easy','Normal','Hard'][data.difficulty]}</p>${['Easy','Normal','Hard'].map((v,i)=>btn(v,'diff'+i)).join('')}${btn('Reset Progress','reset',false,true)}<p class="note">This version has no ads, account, cloud save or analytics. Progress stays in this browser. Clearing site data deletes it. Private browsing or storage restrictions may prevent saving.</p>${btn('Home','home',false,true)}`);document.getElementById('sound').onchange=e=>{data.sound=e.target.checked;save()};for(let i=0;i<3;i++)bind('diff'+i,()=>{data.difficulty=i;save();settings()});bind('reset',()=>{if(confirm('Delete all progress, coins, settings, records and your saved run?')){run=null;data=defaults();save();home()}});bind('home',home)}
function help(){screen('help',`<h2>How to Play</h2><p>Drag around the center to rotate two glowing points and their curved shield. You can also use the left and right arrow keys.</p><p>Block pink shots before they reach the white core. Reflected cyan shots are harmless. Every deflection gives 10 points. You start with 3 lives; each core hit costs 1 life, followed by brief protection.</p><p>Finish campaign waves by reaching the required deflections. Victories award 50 coins and 25 points per remaining life. Endless increases the pressure over time.</p><p>Pause with the button, Escape or Space. The game also pauses when the page loses focus. Continue Game restores a saved run in the same browser, when local storage is available.</p><p>After losing, spend 100 coins to recover once per run. This web version has no advertising.</p>${btn('Home','home')}`);bind('home',home)}
window.addEventListener('blur',()=>{held.clear();if(page==='game'&&!paused)pauseMenu()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&page==='game'&&!paused)pauseMenu()});window.addEventListener('pagehide',persist);home();
</script></body></html>
